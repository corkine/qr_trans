name: Release CI

on:
  # push:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Choose Build Target'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - web
        - android
        - windows
        - macos

jobs:
  build_web:
    name: Build Web Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'web' || github.event.inputs.build_target == 'all'))
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Sync and Extract Version
        id: version
        shell: bash
        run: |
          dart release.dart --only-sync-version
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Web (CanvasKit)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION=${VERSION#v}
          echo "Building with version: $VERSION"
          flutter build web \
            --release \
            --base-href "/qr_trans/" \
            --dart-define=WEB_RENDERER=canvaskit

      - name: Setup Web deployment
        shell: bash
        run: |
          mv build/web build/web-final

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-final

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Web artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: qr-trans-web-${{ github.ref_name }}
          path: build/web-final/
          retention-days: 30

  build_cross_platform:
    name: Build QR Trans App for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_target != 'web')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          # - os: macos-latest
          #   platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Android-specific setup (on Linux runner)
      - name: Set up Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Sync and Extract Version (Windows)
        if: matrix.platform == 'windows'
        id: version-windows
        shell: pwsh
        run: |
          dart release.dart --only-sync-version
          $versionStr = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s]+)').Matches.Groups[1].Value
          "version=$versionStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
      - name: Sync and Extract Version (Unix)
        if: matrix.platform != 'windows'
        id: version-unix
        shell: bash
        run: |
          dart release.dart --only-sync-version
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Enable desktop support
        if: matrix.platform != 'android' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == matrix.platform)
        run: flutter config --enable-${{ matrix.platform }}-desktop

      # Build Steps
      - name: Build Android APK
        if: matrix.platform == 'android' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android')
        shell: bash
        run: |
          VERSION="${{ steps.version-unix.outputs.version }}"
          echo "Building Android with version: $VERSION"
          flutter build apk --release

      - name: Build Windows
        if: matrix.platform == 'windows' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows')
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version-windows.outputs.version }}"
          Write-Host "Building Windows with version: $VERSION"
          flutter build windows --release

      - name: Build macOS
        if: matrix.platform == 'macos' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos')
        shell: bash
        run: |
          VERSION="${{ steps.version-unix.outputs.version }}"
          echo "Building macOS with version: $VERSION"
          flutter build macos --release --no-codesign

      # Packaging and Uploading Artifacts
      - name: Package Windows build
        if: matrix.platform == 'windows' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows')
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath qr-trans-windows-${{ steps.version-windows.outputs.version }}.zip
          
      - name: Package macOS build
        if: matrix.platform == 'macos' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos')
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/qr_trans.app" qr-trans-macos-${{ steps.version-unix.outputs.version }}.zip
      
      - name: Upload Android APK
        if: matrix.platform == 'android' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android')
        uses: actions/upload-artifact@v4
        with:
          name: qr-trans-android-${{ steps.version-unix.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Windows build
        if: matrix.platform == 'windows' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: qr-trans-windows-${{ steps.version-windows.outputs.version }}
          path: qr-trans-windows-${{ steps.version-windows.outputs.version }}.zip

      - name: Upload macOS build
        if: matrix.platform == 'macos' && (github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: qr-trans-macos-${{ steps.version-unix.outputs.version }}
          path: qr-trans-macos-${{ steps.version-unix.outputs.version }}.zip

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_cross_platform]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: List downloaded files
        shell: bash
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/**/*
          body: |
            🎉 QR Trans v${{ steps.version.outputs.version }} 版本发布
            
            ## 🌐 在线体验
            **立即使用 Web 版本**: [![Web App](https://img.shields.io/badge/Web_App-立即体验-2196F3?style=for-the-badge)](https://yourusername.github.io/qr_trans/)
            
            > 🔥 **新功能**: Web 版本现已支持！无需下载安装，在浏览器中直接使用
            
            ## 📱 下载客户端
            | 平台 | 下载链接 | 说明 |
            |------|----------|------|
            | 🌐 **Web** | [在线使用](https://yourusername.github.io/qr_trans/) | 推荐！即开即用，支持所有现代浏览器 |
            | 🤖 **Android** | [APK 文件](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/app-release.apk) | 适用于 Android 5.0+ |
            | 🪟 **Windows** | [ZIP 压缩包](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/qr-trans-windows-${{ steps.version.outputs.version }}.zip) | 解压后运行 qr_trans.exe |
            | 🍎 **macOS** | [ZIP 压缩包](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/qr-trans-macos-${{ steps.version.outputs.version }}.zip) | 支持 macOS 10.14+ |
            
            ## ✨ 版本特性
            - ✅ **全新 Web 版本**: 浏览器直接运行，无需安装
            - ✅ **CanvasKit 渲染**: 高性能图形渲染，流畅体验
            - ✅ **PWA 支持**: 可安装到桌面，离线使用
            - ✅ **响应式设计**: 完美适配桌面和移动端
            - ✅ **文件拖拽**: 支持拖拽上传文件
            - ✅ **剪贴板传输**: 快速传输文本内容
            
            ## 🚀 快速开始
            
            ### Web 版本（推荐）
            1. 点击上方 "立即体验" 链接
            2. 开始传输文件！
            
            ### 客户端版本
            1. 下载对应平台的客户端
            2. 安装或解压运行
            3. 享受完整功能体验
            
            ## 📖 使用说明
            - **发送**: 选择文件 → 生成二维码 → 对方扫描接收
            - **接收**: 点击扫描 → 扫描二维码 → 自动保存文件
            - **设置**: 可调节二维码大小、传输速度等参数
            
            ## 🔧 更新内容
            请查看 [提交历史](https://github.com/${{ github.repository }}/commits) 了解详细更新内容。
            
            ---
            
            💡 **提示**: Web 版本功能与桌面版基本一致，推荐优先体验！
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
